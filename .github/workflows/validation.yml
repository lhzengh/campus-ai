name: Phase 0 validation

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e packages/connector-sdk-python -e 'backend[dev]' -e 'connectors/generic-static[dev]' -e 'connectors/generic-browser[dev]'
      - name: Audit dependencies and production Python code
        run: |
          pip-audit --local --skip-editable
          bandit -r backend/campus_ai connectors/generic-browser/src connectors/generic-static/src packages/connector-sdk-python/src spikes -q -ll
      - run: pytest packages/connector-sdk-python/tests connectors/generic-static/tests connectors/generic-browser/tests backend/tests --cov=campus_ai --cov-report=term-missing

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure ephemeral database credentials
        shell: bash
        run: |
          db_user="ci_$(openssl rand -hex 6)"
          db_name="ci_$(openssl rand -hex 6)"
          db_password="$(openssl rand -hex 24)"
          connector_token="$(openssl rand -hex 32)"
          echo "POSTGRES_DB=$db_name" >> "$GITHUB_ENV"
          echo "POSTGRES_USER=$db_user" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "CAMPUS_AI_DATABASE_URL=postgresql+psycopg://$db_user:$db_password@postgres:5432/$db_name" >> "$GITHUB_ENV"
          echo 'CAMPUS_AI_CONNECTOR_ENDPOINTS={"campus-ai.generic-static":"http://connector-static:8100","campus-ai.generic-browser":"http://connector-browser:8200"}' >> "$GITHUB_ENV"
          echo "CAMPUS_AI_CONNECTOR_SHARED_TOKEN=$connector_token" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose build api connector-static connector-browser
      - run: docker compose up -d postgres connector-static api worker scheduler
      - name: Verify API readiness
        run: curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/health/ready
      - name: Verify persistent worker queue
        run: |
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/v1/jobs \
            -H 'Content-Type: application/json' \
            --data '{"kind":"fetch_all","payload":{"run_key":"ci"},"dedupe_key":"fetch-all:ci","max_attempts":3}'
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/v1/jobs | grep -q '"status":"succeeded"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify Playwright Chromium runtime
        run: >-
          docker run --rm campus-ai-connector-browser:dev python -c
          "from playwright.sync_api import sync_playwright;
          p=sync_playwright().start(); b=p.chromium.launch(headless=True);
          page=b.new_page(); page.set_content('<title>campus-ai-browser-ok</title>');
          assert page.title() == 'campus-ai-browser-ok'; b.close(); p.stop()"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans

  flutter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter build ${{ matrix.target }} --debug
        working-directory: frontend

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: flutter build apk --debug
        working-directory: frontend
