[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-ai-validation"
version = "0.1.0"
description = "Phase-0 validation backend for Campus AI"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.11,<4",
  "campus-ai-connector-sdk>=0.1,<0.2",
  "fastapi>=0.115,<1",
  "google-auth>=2.38,<3",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
]

[tool.setuptools.packages.find]
include = ["campus_ai*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
