[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-ai-connector-generic-browser"
version = "0.1.0"
description = "User-assisted Playwright Connector for Campus AI"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "campus-ai-connector-sdk>=0.1,<0.2",
  "cryptography>=50,<51",
  "playwright>=1.50,<2",
  "selectolax>=0.3,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[project.scripts]
campus-browser-login = "campus_ai_connector_generic_browser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["campus_ai_connector_generic_browser*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
