[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-ai-connector-generic-static"
version = "0.1.0"
description = "Configurable static HTTP Connector for Campus AI"
requires-python = ">=3.11,<3.15"
dependencies = [
  "campus-ai-connector-sdk>=0.1,<0.2",
  "httpx>=0.28,<1",
  "selectolax>=0.3,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["campus_ai_connector_generic_static*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
