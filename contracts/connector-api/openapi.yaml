openapi: 3.1.0
info:
  title: Campus AI Connector API
  version: 1.0.0
  description: Versioned boundary used by Campus AI Core to call independent source Connectors.
servers:
  - url: https://connector.example
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      security: []
      operationId: connectorLive
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /v1/manifest:
    get:
      operationId: getConnectorManifest
      responses:
        "200":
          description: Connector identity, compatibility, capabilities, and configuration schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/config/validate:
    post:
      operationId: validateConnectorConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigValidationRequest"
      responses:
        "200":
          description: Normalized non-secret configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidationResult"
        "422":
          $ref: "#/components/responses/ConnectorError"
  /v1/auth/status:
    post:
      operationId: getConnectorAuthStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthStatusRequest"
      responses:
        "200":
          description: Current source-instance authentication state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
  /v1/auth/begin:
    post:
      operationId: beginConnectorAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthStatusRequest"
      responses:
        "200":
          description: Authentication state and optional user challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "405":
          $ref: "#/components/responses/ConnectorError"
  /v1/auth/respond:
    post:
      operationId: respondToConnectorAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAuthRequest"
      responses:
        "200":
          description: Updated authentication state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "409":
          $ref: "#/components/responses/ConnectorError"
  /v1/sync:
    post:
      operationId: syncConnector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Normalized incremental batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusItemBatch"
        "409":
          $ref: "#/components/responses/ConnectorError"
        "429":
          $ref: "#/components/responses/ConnectorError"
        "503":
          $ref: "#/components/responses/ConnectorError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid internal Connector token.
    ConnectorError:
      description: Typed error that Core can handle without parsing text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConnectorError"
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    ConnectorManifest:
      type: object
      required: [connector_id, version, contract_version, display_name, capabilities, config_schema, requires_browser]
      properties:
        connector_id:
          type: string
          pattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)+$"
        version:
          type: string
        contract_version:
          type: string
          example: "1.0"
        display_name:
          type: string
        description:
          type: string
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [sync, incremental_sync, attachments, user_assisted_auth, browser]
        config_schema:
          $ref: "#/components/schemas/JsonObject"
        requires_browser:
          type: boolean
    ConfigValidationRequest:
      type: object
      required: [config]
      properties:
        config:
          $ref: "#/components/schemas/JsonObject"
    ConfigValidationResult:
      type: object
      required: [valid, normalized_config, errors]
      properties:
        valid:
          type: boolean
        normalized_config:
          $ref: "#/components/schemas/JsonObject"
        errors:
          type: object
          additionalProperties:
            type: string
    AuthStatusRequest:
      type: object
      required: [instance_id, config]
      properties:
        instance_id:
          type: string
        config:
          $ref: "#/components/schemas/JsonObject"
    SubmitAuthRequest:
      allOf:
        - $ref: "#/components/schemas/AuthStatusRequest"
        - type: object
          required: [challenge_id, response]
          properties:
            challenge_id:
              type: string
            response:
              type: object
              additionalProperties:
                type: string
    AuthResult:
      type: object
      required: [state, message]
      properties:
        state:
          $ref: "#/components/schemas/AuthState"
        challenge:
          anyOf:
            - $ref: "#/components/schemas/AuthChallenge"
            - type: "null"
        message:
          type: string
    AuthState:
      type: string
      enum: [not_required, auth_required, waiting_for_user, ready, expired]
    AuthChallenge:
      type: object
      required: [challenge_id, kind, title, instructions, fields, metadata]
      properties:
        challenge_id:
          type: string
        kind:
          type: string
          enum: [username_password, sms_code, qr_scan, captcha, browser_interaction, confirmation]
        title:
          type: string
        instructions:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AuthChallengeField"
        expires_at:
          type: [string, "null"]
          format: date-time
        metadata:
          $ref: "#/components/schemas/JsonObject"
    AuthChallengeField:
      type: object
      required: [name, label, input_type, secret, required]
      properties:
        name:
          type: string
        label:
          type: string
        input_type:
          type: string
        secret:
          type: boolean
        required:
          type: boolean
    SyncRequest:
      type: object
      required: [instance_id, config, cursor, max_items]
      properties:
        instance_id:
          type: string
        config:
          $ref: "#/components/schemas/JsonObject"
        cursor:
          $ref: "#/components/schemas/JsonObject"
        max_items:
          type: integer
          minimum: 1
          maximum: 1000
    CampusItemBatch:
      type: object
      required: [contract_version, items, next_cursor, has_more, auth_state, warnings]
      properties:
        contract_version:
          type: string
          const: "1.0"
        items:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CampusItem"
        next_cursor:
          $ref: "#/components/schemas/JsonObject"
        has_more:
          type: boolean
        auth_state:
          $ref: "#/components/schemas/AuthState"
        warnings:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyncWarning"
    CampusItem:
      type: object
      required: [external_id, item_type, source_url, title, content_text, attachments, extensions]
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 500
        item_type:
          $ref: "#/components/schemas/CampusItemType"
        source_url:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 2000
        content_text:
          type: string
          maxLength: 1000000
        content_html:
          type: [string, "null"]
          maxLength: 2000000
        publisher:
          anyOf:
            - $ref: "#/components/schemas/CampusPublisher"
            - type: "null"
        published_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
        attachments:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CampusAttachment"
        extensions:
          type: object
          propertyNames:
            pattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)+$"
          additionalProperties: true
    CampusItemType:
      type: string
      enum: [announcement, news, event, resource, other]
    CampusPublisher:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        external_id:
          type: [string, "null"]
          maxLength: 500
    CampusAttachment:
      type: object
      required: [name, access]
      properties:
        external_id:
          type: [string, "null"]
          maxLength: 500
        name:
          type: string
          minLength: 1
          maxLength: 1000
        media_type:
          type: [string, "null"]
          maxLength: 255
        size_bytes:
          type: [integer, "null"]
          minimum: 0
        content_hash:
          type: [string, "null"]
          maxLength: 200
        access:
          $ref: "#/components/schemas/AttachmentAccess"
    AttachmentAccess:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, url]
          properties:
            mode:
              type: string
              const: public_url
            url:
              type: string
              format: uri
            ref:
              type: "null"
        - type: object
          additionalProperties: false
          required: [mode, ref]
          properties:
            mode:
              type: string
              const: connector_fetch
            url:
              type: "null"
            ref:
              type: string
              minLength: 1
              maxLength: 2000
    SyncWarning:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          pattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)*$"
        message:
          type: string
          minLength: 1
          maxLength: 2000
        external_id:
          type: [string, "null"]
          maxLength: 500
        details:
          $ref: "#/components/schemas/JsonObject"
    ConnectorError:
      type: object
      required: [code, message, retryable, details]
      properties:
        code:
          type: string
          enum: [config_invalid, auth_required, access_denied, rate_limited, source_changed, temporary_failure, unsupported_operation, protocol_mismatch]
        message:
          type: string
        retryable:
          type: boolean
        details:
          $ref: "#/components/schemas/JsonObject"
